<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalie's Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Natalie's Dashboard</h1>
        <button type="button" id="theme-toggle" class="btn btn-primary">Toggle dark mode</button>
    </header>
    <main>
        <section class="widget">
            <h2>Sample Weather</h2>
            <div id="weather-display">Loading weather…</div>
        </section>
        <section class="widget">
            <h2>Words from Taylor</h2>
            <div id="quote-display">Loading quotes…</div>
            <button type="button" id="new-quote-button" class="btn btn-primary" disabled>New Quote</button>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
